name: sitedig

# SiteDig stack for Portainer.
#
# - `web`      : Next.js UI + API (never executes scanner commands)
# - `worker`   : scanner queue + tool executor (owns all subprocesses)
# Both services run the SAME image from GHCR with different commands.
# The stack attaches to the shared Docker network used by Nginx Proxy Manager.
# No host ports are published; NPM proxies to the `web` service on port 3000.

services:
  web:
    image: ${SITEDIG_IMAGE:-ghcr.io/bangsmackpow/sitedig}:${SITEDIG_TAG:-latest}
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000"]
    environment:
      WORKER_URL: ${WORKER_URL:-http://worker:8081}
      SCAN_SERVICE_TOKEN: ${SCAN_SERVICE_TOKEN:-please-change-me}
      WEB_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${SITEDIG_TAG:-latest}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  worker:
    image: ${SITEDIG_IMAGE:-ghcr.io/bangsmackpow/sitedig}:${SITEDIG_TAG:-latest}
    command: ["node", "dist-worker/worker/index.js"]
    environment:
      WORKER_PORT: "8081"
      SCAN_SERVICE_TOKEN: ${SCAN_SERVICE_TOKEN:-please-change-me}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-1}
      MAX_QUEUE: ${MAX_QUEUE:-3}
      SCAN_TIMEOUT_MS: ${SCAN_TIMEOUT_MS:-300000}
      MAX_TOOL_OUTPUT_BYTES: ${MAX_TOOL_OUTPUT_BYTES:-20971520}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_INTERNAL_TARGETS: ${ALLOW_INTERNAL_TARGETS:-false}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/tmp/sitedig-artifacts}
      ARTIFACT_TTL_MINUTES: ${ARTIFACT_TTL_MINUTES:-30}
      APP_VERSION: ${SITEDIG_TAG:-latest}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  backend:
    external: true
