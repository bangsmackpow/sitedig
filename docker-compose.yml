name: sitedig

# SiteDig stack for Portainer.
#
# - `web`      : Next.js UI + API (never executes scanner commands)
# - `worker`   : scanner queue + tool executor (owns all subprocesses)
# Both services run the SAME image from GHCR with different commands.
# The stack attaches to the shared Docker network used by Nginx Proxy Manager.
# No host ports are published; NPM proxies to the `web` service on port 3000.

services:
  web:
    image: ${SITEDIG_IMAGE:-ghcr.io/bangsmackpow/sitedig}:${SITEDIG_TAG:-latest}
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000"]
    environment:
      WORKER_URL: ${WORKER_URL:-http://worker:8081}
      SCAN_SERVICE_TOKEN: ${SCAN_SERVICE_TOKEN:-please-change-me}
      WEB_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${SITEDIG_TAG:-latest}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
      DATABASE_PATH: ${DATABASE_PATH:-/data/sitedig.sqlite}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
      ENABLED_MODULES: ${ENABLED_MODULES:-}
    volumes:
      - sitedig-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  worker:
    image: ${SITEDIG_IMAGE:-ghcr.io/bangsmackpow/sitedig}:${SITEDIG_TAG:-latest}
    command: ["node", "dist-worker/worker/index.js"]
    environment:
      WORKER_PORT: "8081"
      SCAN_SERVICE_TOKEN: ${SCAN_SERVICE_TOKEN:-please-change-me}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-1}
      MAX_QUEUE: ${MAX_QUEUE:-3}
      SCAN_TIMEOUT_MS: ${SCAN_TIMEOUT_MS:-600000}
      MAX_TOOL_OUTPUT_BYTES: ${MAX_TOOL_OUTPUT_BYTES:-20971520}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_INTERNAL_TARGETS: ${ALLOW_INTERNAL_TARGETS:-false}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/tmp/sitedig-artifacts}
      ARTIFACT_TTL_MINUTES: ${ARTIFACT_TTL_MINUTES:-30}
      ENABLED_MODULES: ${ENABLED_MODULES:-}
      WPSCAN_API_TOKEN: ${WPSCAN_API_TOKEN:-}
      NUCLEI_TEMPLATES: ${NUCLEI_TEMPLATES:-http/technologies/tech-detect.yaml,http/exposures/configs/git-config.yaml,ssl/tls-version.yaml,ssl/deprecated-tls.yaml,ssl/self-signed-ssl.yaml,ssl/expired-ssl.yaml,ssl/weak-cipher-suites.yaml}
      NUCLEI_TEMPLATES_DIR: ${NUCLEI_TEMPLATES_DIR:-/opt/nuclei-templates}
      CONTENT_WORDLIST: ${CONTENT_WORDLIST:-/opt/sitedig/wordlists/common.txt}
      APP_VERSION: ${SITEDIG_TAG:-latest}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  backend:
    external: true

volumes:
  sitedig-data:
