name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (web + worker)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Validate docker-compose.yml
        run: npm run validate:compose

      - name: Validate compose with Docker CLI
        run: docker compose config --quiet

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=${{ env.IMAGE }}:${VERSION},${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            SHA="${{ github.sha }}"
            echo "tags=${{ env.IMAGE }}:latest,${{ env.IMAGE }}:sha-${SHA::12}" >> "$GITHUB_OUTPUT"
            echo "version=sha-${SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Trigger Portainer stack update
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" -o /dev/null \
            && echo "Portainer stack update triggered." \
            || { echo "::warning::Portainer webhook request failed."; exit 0; }
